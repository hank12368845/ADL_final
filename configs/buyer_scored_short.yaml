# One full 5x10 market; fewer markets, not a truncated horizon. Toy TA opponents.
name: buyer_scored_short_5x10
seed: 0
models: configs/models.yaml
sellers:
- agents/_ta/seller
- training/fixtures/scale_seller_1.yaml
- training/fixtures/scale_seller_2.yaml
buyers:
- agents/example_student/buyer
- agents/_ta/buyer
- training/fixtures/scale_buyer_1.yaml
- training/fixtures/scale_buyer_2.yaml
- training/fixtures/scale_buyer_3.yaml
- training/fixtures/scale_buyer_4.yaml
personas_per_student: 3
repeats: 1
rotate: false
save_trajectories: true
save_prompts: true
market:
  catalog: scenarios/public/catalog.yaml
  rounds:
    total: 5
    turns_per_round: 6
    output_tokens_per_round: 8192
  schema:
    items: scenarios/public/items_example.json
    budget_extra: 0.15
  channels:
    board: true
    dm: true
    seller_room: false
    buyer_room: true
